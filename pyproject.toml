[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorcore-ann"
version = "0.1.0"
description = "High-performance lightweight Approximate Nearest Neighbor (ANN) vector search engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Irtaz Irfan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/irtazirfan08-source/VectorCore"
Repository = "https://github.com/irtazirfan08-source/VectorCore.git"

[tool.hatch.build.targets.wheel]
packages = ["vector_core"]